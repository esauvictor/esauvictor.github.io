  function keepAwake(){
    try{

        try{navigator.mediaSession.setActionHandler('hangup',function(){bye(function(){cleanup('Call ended.')})})}catch(e){}
      }
    }catch(e){}

        });

  }
  function showTip(){var t=document.getElementById('callTip');if(t&&window.matchMedia&&matchMedia('(pointer:coarse)').matches)t.hidden=false}

  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden'&&connected){try{dc&&dc.open&&dc.send('hidden')}catch(e){}}
  });

    try{var mb=document.getElementById('callMic');if(mb)mb.hidden=true;var tp=document.getElementById('callTip');if(tp)tp.hidden=true}catch(e){}

  }

  });
  function warnStop(){clearInterval(warn.iv);warn.iv=null;warn.bad=0}

  function warnUpdate(g,live){

  }
  // Extra line for connection-type failures, only when the network really looks weak.
  function hint(){
    if(net.grade==='offline')return 'You appear to be offline.';
    if(net.grade==='poor'||net.grade==='bad')return 'Your connection looks weak. Move '+where()+' and try again.';
    return '';
  }
  netStart();
  // ---------- Call timer ----------
  var callT0=0, durIv=null;
  function fmtDur(ms){var n=Math.max(0,Math.floor(ms/1000)),h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return (h?h+':'+(m<10?'0':''):'')+m+':'+(s<10?'0':'')+s}

    if(!callT0)callT0=Date.now();   // kept across reconnects, so the timer does not restart
    $('callDurL').textContent='Call time'; $('callDur').hidden=false; durTick();
    if(!durIv)durIv=setInterval(durTick,1000);
  }
  function durNote(){return callT0?' Call lasted '+fmtDur(Date.now()-callT0)+'.':''}
  function durStop(){
    if(durIv){clearInterval(durIv);durIv=null}
    if(callT0){durTick();$('callDurL').textContent='Call lasted'}   // the final time stays on screen
    callT0=0;
  }
  // ---------- Text chat over the call's side-channel (nothing is stored anywhere) ----------
  var chatBox=$('callChat'), chatLog=$('callChatLog'), chatIn=$('callChatIn'), chatBtn=$('callChatSend'), rxN=0, rxT=0, titleBak=null;
  function sendObj(o){try{if(dc&&dc.open){dc.send(JSON.stringify(o));return true}}catch(e){}return false}
  function chatLine(cls,text){
    var row=document.createElement('div'), b=document.createElement('span');
    row.className='m '+cls; b.className='b'; b.textContent=text; row.appendChild(b); chatLog.appendChild(row);
    while(chatLog.children.length>60)chatLog.removeChild(chatLog.firstChild);
    chatLog.scrollTop=chatLog.scrollHeight;
  }
  function chatEnable(open){chatIn.disabled=chatBtn.disabled=!open;chatIn.placeholder=open?'Message '+PEER.name+'…':'Chat is connecting…'}
  function chatShow(on){chatBox.hidden=!on;muteBtn.hidden=!on;if(!on){muted=false;muteBtn.textContent='Mute mic';typingClear()}if(!on){chatLog.textContent='';chatIn.value='';chatEnable(false)}else chatEnable(!!(dc&&dc.open))}
  function chatSend(){
    var t=chatIn.value.trim().slice(0,500); if(!t)return;
    if(!sendObj({t:'msg',m:t})){chatLine('sys','Not sent. The chat link is not ready yet, try again in a moment.');return}
    chatLine('me',t); chatIn.value=''; chatIn.focus();
  }
  chatBtn.addEventListener('click',chatSend);
  chatIn.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();chatSend()}});
  function chatDing(){
    try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
    var c=warn.ctx; if(!c||c.state!=='running')return;
    var t=c.currentTime, o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.2,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);

  }
  function onChatMsg(o){
    var now=Date.now(); if(now-rxT>5000){rxT=now;rxN=0} if(++rxN>8)return;   // ignore floods
    if(typeof o.m!=='string')return;
    var m=o.m.slice(0,500).trim(); if(!m)return;
    typingClear(); chatLine('them',m); chatDing(); chatWake();
    if(document.hidden){if(titleBak===null)titleBak=document.title;document.title='\uD83D\uDCAC New message'}
  }
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&titleBak!==null){document.title=titleBak;titleBak=null}});
  function chatWake(){}
  // ---------- End-of-call tune + mic mute ----------
  var userEnd=false, muted=false, muteBtn=$('callMuteBtn');
  function endTune(kind){   // 'end' = someone hung up (falling chime); 'drop' = the line was lost (lower, slower)
    try{navigator.vibrate&&navigator.vibrate(kind==='end'?[200]:[300,120,300])}catch(e){}
    warnCtx();
    var c=warn.ctx; if(!c||c.state!=='running')return;
    var t=c.currentTime, notes=kind==='end'?[[0,784],[0.16,659],[0.32,523]]:[[0,440],[0.22,349],[0.44,262]];
    notes.forEach(function(n){
      var o=c.createOscillator(),g=c.createGain();
      o.type='sine';o.frequency.value=n[1];
      g.gain.setValueAtTime(0.0001,t+n[0]);g.gain.exponentialRampToValueAtTime(0.28,t+n[0]+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+n[0]+0.3);
      o.connect(g);g.connect(c.destination);o.start(t+n[0]);o.stop(t+n[0]+0.33);
    });
  }
  function muteSet(m){
    muted=m;
    try{stream&&stream.getAudioTracks().forEach(function(t){t.enabled=!m})}catch(e){}
    muteBtn.textContent=m?'Unmute mic':'Mute mic';
    sendObj({t:'mute',m:m});
  }
  muteBtn.addEventListener('click',function(){muteSet(!muted)});
  // ---------- Typing indicator ----------
  var typTx=0, typIv=null, typEl=$('callTyping');
  function typingClear(){clearTimeout(typIv);typIv=null;typEl.textContent=''}
  function onTyping(){typEl.textContent=PEER.name+' is typing…';clearTimeout(typIv);typIv=setTimeout(typingClear,3500)}
  chatIn.addEventListener('input',function(){var n=Date.now();if(chatIn.value&&n-typTx>2000){typTx=n;sendObj({t:'typing'})}});
  // Messages and signals from the visitor, sent over the call's side-channel.
  function onData(d){
    if(typeof d!=='string')return;
    if(d==='bye'){if(!closing){byeRx=true;cleanup('Call ended.')}}
    else if(d==='hidden'){net.peerHidden=true;say("The visitor's phone screen is off, so their microphone is paused. They can still hear you. Wait for them to wake the phone.")}
    else if(d==='back'){net.peerHidden=false;say('The visitor is back. Talk now.')}
    else if(d.charAt(0)==='{'){var o;try{o=JSON.parse(d)}catch(e){return}if(!o||typeof o!=='object')return;if(o.t==='net')onNetMsg(o);else if(o.t==='msg')onChatMsg(o);else if(o.t==='typing')onTyping();else if(o.t==='mute'){net.peerHidden=!!o.m;say(o.m?'The visitor muted their microphone.':'The visitor unmuted. Talk now.')}}
  }
function say(m){$('s').textContent=m}
function cleanup(msg,h){
  var extra=h?hint():'', dn=durNote();
  closing=true;
  clearTimeout(connT);clearTimeout(dT);
  try{dc&&dc.close()}catch(e){}
  if(call){try{call.close()}catch(e){}}
  if(peer){try{peer.destroy()}catch(e){}}
  if(stream){stream.getTracks().forEach(function(t){t.stop()})}
  peer=call=stream=dc=null; connected=ready=wantCall=false; recov=false; byeRx=false; maxTries=12; $('end').hidden=true;
  netLiveStop(); netIdle(); releaseAwake(); if(dn)endTune(/^Call ended/.test(msg||'')?'end':'drop'); durStop(); chatShow(false); closing=false;
  if(msg)say(msg+dn+(extra?' '+extra:''));
}
function getIce(){
  return fetch(API+'/call/ice.php').then(function(r){return r.json()})
    .then(function(j){return j.iceServers&&j.iceServers.length?j.iceServers:FALLBACK_ICE})
    .catch(function(){return FALLBACK_ICE});
}
function tryPlay(){$('a').play().catch(function(){})}
if(!/^v-[a-f0-9]{32}$/.test(target)){
  say('This link is invalid or incomplete. Use the link in the WhatsApp alert.');
}else{
  var age=sent?Math.round((Date.now()/1000-sent)/60):0;
  say(age>=3?'This request is '+age+' min old, so the visitor may have left. You can still try.':'A visitor is waiting. Tap Answer.');
  $('yes').hidden=false;
  // Connect to the signalling server NOW, while you read the page, so Answer is instant.
  getIce().then(function(ice){
    peer=new Peer({config:{iceServers:ice,iceCandidatePoolSize:4}});
    peer.on('open',function(){ready=true;if(wantCall&&stream)dial()});
    peer.on('disconnected',function(){try{peer&&peer.reconnect()}catch(e){}});
    peer.on('error',function(e){
      if(e.type==='peer-unavailable'){
        if(tries<maxTries){say((recov?'Reconnecting… ':'Visitor not ready yet… ')+'retrying ('+tries+'/'+maxTries+')');setTimeout(dial,1500)}
        else cleanup(recov?'The call could not be restored.':'The visitor has already left.');
      }else if(connected||recov){try{peer.reconnect()}catch(x){}}
      else cleanup('Connection problem ('+e.type+'). Reload this page and try again.',1);
    });
  });
}
$('yes').onclick=async function(){
  $('yes').hidden=true; warnCtx(); keepAwake(); say('Allowing microphone…');
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){say('Microphone blocked. Allow it in your browser settings, then reload this page.');$('yes').hidden=false;return}
  wantCall=true; say('Connecting…');
  if(ready)dial();
};
// Tell the other side "I hung up on purpose" so it ends at once instead of trying to reconnect.
function bye(then){
  var sent=false;
  try{if(dc&&dc.open){dc.send('bye');sent=true}}catch(e){}
  if(sent)setTimeout(then,250);else then();
}
// The line dropped (usually a phone slept and its network paused). Do not end: ring the visitor again automatically.
function recoverCall(){
  if(!connected||byeRx||recov||closing)return;
  recov=true; connected=false; netLiveStop(); chatEnable(false); clearTimeout(dT);
  var old=call; call=null;
  if(old){try{old.close()}catch(e){}}
  say('Connection lost. Reconnecting…'); $('end').hidden=false;
  tries=0; maxTries=40;
  try{if(peer&&peer.disconnected)peer.reconnect()}catch(e){}
  setTimeout(dial,1500);
}
function watch(c){
  var pc=c.peerConnection;
  clearTimeout(connT);
  connT=setTimeout(function(){if(!connected){if(recov&&tries<maxTries)setTimeout(dial,1500);else cleanup(recov?'The call could not be restored.':'Audio could not connect (network block). Ask the visitor to WhatsApp you.',1)}},30000);
  if(!pc)return;
  pc.addEventListener('iceconnectionstatechange',function(){
    if(c!==call||closing)return;
    var s=pc.iceConnectionState;
    if(s==='connected'||s==='completed'){
      net.disc=false; clearTimeout(dT);
      if(!connected){
        connected=true;recov=false;maxTries=12;clearTimeout(connT);connectCue();keepAwake();say('Connected. Talk now.');tryPlay();durStart();chatShow(true);netLiveStart(pc);
        try{dc&&dc.close()}catch(e){}
        try{dc=peer.connect(target,{reliable:true});var d0=dc;dc.on('open',function(){if(d0===dc){chatEnable(true);netIdle()}});dc.on('close',function(){if(d0===dc)chatEnable(false)});dc.on('data',onData)}catch(e){}
      }

      if(connected)recoverCall();
      else if(recov&&tries<maxTries)setTimeout(dial,1500);
      else cleanup(recov?'The call could not be restored.':'Audio could not connect (network block). Ask the visitor to WhatsApp you.',1);
    }else if(s==='disconnected'&&connected){
      say('Connection unstable…');net.disc=true;netLive();

    }

}
function dial(){
  if(!peer||peer.destroyed||!stream||closing)return;
  var tr=stream.getAudioTracks()[0];
  if(tr&&tr.readyState==='ended'){ // the phone cut the mic while asleep: open it again, then dial
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(ns){
      if(ns.getAudioTracks()[0].readyState!=='live'){cleanup('Microphone lost. Reload this page and try again.');return}
      stream=ns;dial();
    }).catch(function(){cleanup('Microphone lost. Reload this page and try again.')});
    return;
  }

  var o=call; call=null;
  if(o){try{o.close()}catch(e){}}

  call=c;
  say(recov?'Reconnecting…':'Calling visitor…'); $('end').hidden=false;
  watch(c);

$('end').onclick=function(){bye(function(){cleanup('Call ended.')})};
