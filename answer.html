<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0c0a08;color:#f5ede4;font-family:ui-monospace,Menlo,Consolas,monospace}

#callNet[data-q=bad],#callNet[data-q=offline]{--q:#ef4444}
#callNet[data-q=poor],#callNet[data-q=bad],#callNet[data-q=offline]{border-color:var(--q)}
#callNetBars{display:flex;align-items:flex-end;gap:3px;height:20px;flex:none;margin-top:1px}

#callNetBars i:nth-child(1){height:6px}#callNetBars i:nth-child(2){height:10px}#callNetBars i:nth-child(3){height:15px}#callNetBars i:nth-child(4){height:20px}
#callNet[data-q=good] #callNetBars i,#callNet[data-q=fair] #callNetBars i:nth-child(-n+3),#callNet[data-q=poor] #callNetBars i:nth-child(-n+2),#callNet[data-q=bad] #callNetBars i:nth-child(1){background:var(--q);opacity:1}
#callNet[data-q=checking] #callNetBars i{animation:np 1.2s ease-in-out infinite}
#callNet[data-q=checking] #callNetBars i:nth-child(2){animation-delay:.15s}#callNet[data-q=checking] #callNetBars i:nth-child(3){animation-delay:.3s}#callNet[data-q=checking] #callNetBars i:nth-child(4){animation-delay:.45s}

#callNetTip{margin-top:3px;font-size:.78rem;line-height:1.5;color:#b8a898}#callNetTip:empty{display:none}

</style></head><body><div class="box">
<h1>Website call</h1>
<div id="s">Checking link…</div>
<div id="callNet" data-q="checking">
  <span id="callNetBars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  <div id="callNetText">
    <div aria-live="polite"><div id="callNetLabel">Checking your network…</div><div id="callNetTip"></div></div>
    <div id="callNetStats"></div>
  </div>
</div>
<button id="yes" hidden>📞 Answer</button>
<button id="end" hidden>Hang up</button>
<audio id="a" autoplay playsinline></audio>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1/dist/peerjs.min.js"></script>
<script>
var API='https://esauvictor.name.ng/api';
var FALLBACK_ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];
var $=function(i){return document.getElementById(i)};
var q=new URLSearchParams(location.search), target=q.get('c')||'', sent=+q.get('t')||0;
var peer=null, call=null, stream=null, connT=null, tries=0, connected=false, ready=false, wantCall=false;
var dc=null, recov=false, byeRx=false, closing=false, dT=null, maxTries=12; // dc = tiny side-channel used only to say "bye"
  // ---------- Network quality: pre-call check + live stats during the call ----------
  var netEl=$('callNet'), netLbl=$('callNetLabel'), netTip=$('callNetTip'), netStat=$('callNetStats');
  var net={pc:null,on:false,liveIv:null,idleIv:null,prev:null,hist:[],stall:0,disc:false,probeMs:null,probeT0:0,probeFail:false,grade:'checking'};
  var RANK={good:0,fair:1,poor:2,bad:3};
  var LABEL={checking:'Checking your network…',good:'Good connection',fair:'Fair connection',poor:'Poor connection',bad:'Very poor connection',offline:'No internet connection'};
  // Thresholds: [fair, poor, bad]. Tune here if the labels feel too strict or too lenient.
  var LIM={
    loss:[3,8,20],          // % of audio packets lost
    jit:[40,80,150],        // ms of jitter
    rtt:[350,600,1000],     // ms round-trip to the other side
    probe:[1200,2500,5000], // ms for a cold request to this site (includes TLS setup)
    hrtt:[500,900,1500]     // ms, browser's own RTT estimate (navigator.connection)
  };
  function conn(){return navigator.connection||navigator.mozConnection||navigator.webkitConnection||null}
  function level(v,l){return v>=l[2]?'bad':v>=l[1]?'poor':v>=l[0]?'fair':'good'}
  function worst(){var r={g:'good',why:''};r.up=function(x,w){if(RANK[x]>RANK[r.g]){r.g=x;r.why=w}};return r}
  function avg(k){var n=0,t=0;net.hist.forEach(function(h){if(h[k]!=null){n++;t+=h[k]}});return n?t/n:null}
  // Where to move depends on how the visitor is connected (type is only exposed on Android Chrome).
  function where(){
    var c=conn(),t=c&&c.type;
    if(t==='wifi')return 'closer to your router, or switch to mobile data';
    if(t==='cellular')return 'near a window, outdoors or to higher ground, or switch to Wi-Fi';
    return 'near a window or into an open area, away from thick walls, or switch between Wi-Fi and mobile data';
  }
  function advice(g,why,live){
    if(g==='offline')return "You're offline. Check your Wi-Fi or mobile data. The call needs internet.";
    if(g==='checking')return '';
    var w=where();
    if(g==='good')return live?'Audio is clear. Stay where you are.':'Strong enough for a clear call. Stay where you are.';
    if(g==='fair')return 'A bit rough but workable. Stay put for now. If the audio starts breaking up, move '+w+'.';
    var lead={
      stall:'Audio has stopped coming through, so your signal may have dropped. ',
      loss:'Your signal is unstable and the audio is breaking up. ',
      jit:'Your signal is unstable and the audio is breaking up. ',
      lag:'Your connection is slow to respond, so there will be delays. ',
      slow:'Your connection is weak. ',
      unreachable:"Couldn't reach the server, so your connection may be weak or blocked. ",
      drop:'Your connection dropped. '
    }[why]||'';
    if(g==='poor')return lead+'Move '+w+' for a clearer call.';
    return lead+'Move '+w+' now.'+(live?' You will hear beeps while the call is at risk of cutting. If the audio does not come back, hang up and reopen the link from a better spot.':' If it stays this weak, replying to the visitor on WhatsApp is more reliable.');
  }
  function setNet(g,why,stats,live){
    var tip=advice(g,why,live), s=stats||'';
    net.grade=g;
    if(netEl.getAttribute('data-q')!==g)netEl.setAttribute('data-q',g);
    if(netLbl.textContent!==LABEL[g])netLbl.textContent=LABEL[g];
    if(netTip.textContent!==tip)netTip.textContent=tip;
    if(netStat.textContent!==s)netStat.textContent=s;
    warnUpdate(g,live);
  }
  // Before the call connects: browser connection info + how fast the site answered.
  function netIdle(){
    if(net.on)return;
    if(navigator.onLine===false){setNet('offline','offline');return}
    var c=conn(), r=worst(), parts=[];
    if(c){
      var t=c.effectiveType;
      if(t==='slow-2g'||t==='2g')r.up('bad','slow'); else if(t==='3g')r.up('fair','slow');
      if(c.rtt>0)r.up(level(c.rtt,LIM.hrtt),'lag');
      if(c.downlink>0&&c.downlink<0.1)r.up('poor','slow');
      if(t)parts.push(String(t).toUpperCase());
      if(c.downlink>0)parts.push('~'+c.downlink+' Mbps');
      if(c.rtt>0)parts.push('~'+c.rtt+' ms ping');
    }
    var pending=net.probeT0>0&&net.probeMs==null&&!net.probeFail;
    if(net.probeFail)r.up('poor','unreachable');
    else if(net.probeMs!=null){r.up(level(net.probeMs,LIM.probe),'slow');if(!c)parts.push('server response '+Math.round(net.probeMs)+' ms')}
    else if(pending&&performance.now()-net.probeT0>4000)r.up('poor','slow');
    var measured=!!c||net.probeMs!=null||net.probeFail||(pending&&performance.now()-net.probeT0>4000);
    setNet(measured?r.g:'checking',r.why,parts.join(' · '),false);
  }
  function netIdleStart(){netIdle();if(!net.idleIv)net.idleIv=setInterval(netIdle,3000)}
  function netIdleStop(){clearInterval(net.idleIv);net.idleIv=null}
  // During the call: real WebRTC stats (packet loss, jitter, round trip), sampled every 2s, averaged over 3 samples.
  function netLive(){
    var pc=net.pc; if(!pc)return;
    if(document.hidden)return;   // screen locked or tab hidden: skip sampling
    if(navigator.onLine===false){setNet('offline','offline','',true);return}
    if(net.disc){setNet('bad','drop','',true);return}
    if(!pc.getStats)return;
    pc.getStats().then(function(rep){
      if(net.pc!==pc||net.disc)return;
      var inb=null,rin=null,selId=null,pair=null;
      rep.forEach(function(x){
        var au=(x.kind||x.mediaType)==='audio';
        if(x.type==='inbound-rtp'&&au)inb=x;
        else if(x.type==='remote-inbound-rtp'&&au)rin=x;
        else if(x.type==='transport'&&x.selectedCandidatePairId)selId=x.selectedCandidatePairId;
      });
      rep.forEach(function(x){
        if(x.type==='candidate-pair'&&(selId?x.id===selId:(x.selected||(x.nominated&&x.state==='succeeded'))))pair=x;
      });
      var rtt=null,jit=null,loss=null;
      if(pair&&typeof pair.currentRoundTripTime==='number')rtt=pair.currentRoundTripTime*1000;
      else if(rin&&typeof rin.roundTripTime==='number')rtt=rin.roundTripTime*1000;
      if(inb){
        if(typeof inb.jitter==='number')jit=inb.jitter*1000;
        var recv=inb.packetsReceived||0, lost=Math.max(0,inb.packetsLost||0), p=net.prev;
        if(p){
          var dr=recv-p.recv, dl=Math.max(0,lost-p.lost);
          if(dr+dl>0)loss=dl/(dr+dl)*100;
          net.stall=dr<=0?net.stall+1:0;   // 3 silent samples in a row = audio has stopped
        }
        net.prev={recv:recv,lost:lost};
      }
      net.hist.push({rtt:rtt,jit:jit,loss:loss}); if(net.hist.length>3)net.hist.shift();
      var la=avg('loss'), ja=avg('jit'), ta=avg('rtt'), g=worst(), parts=[];
      if(net.stall>=3)g.up('bad','stall');
      if(la!=null)g.up(level(la,LIM.loss),'loss');
      if(ja!=null)g.up(level(ja,LIM.jit),'jit');
      if(ta!=null)g.up(level(ta,LIM.rtt),'lag');
      if(ta!=null)parts.push('ping '+Math.round(ta)+' ms');
      if(ja!=null)parts.push('jitter '+Math.round(ja)+' ms');
      if(la!=null)parts.push('loss '+(la<10?la.toFixed(1):Math.round(la))+'%');
      setNet(g.g,g.why,parts.join(' · '),true);
    }).catch(function(){});
  }
  function netLiveStart(pc){
    netLiveStop(); net.pc=pc; net.on=true;
    netLive(); net.liveIv=setInterval(netLive,2000);
  }
  function netLiveStop(){
    clearInterval(net.liveIv); net.liveIv=null;
    net.pc=null; net.on=false; net.prev=null; net.hist=[]; net.stall=0; net.disc=false;
    warnStop();
  }
  window.addEventListener('offline',function(){if(net.on)netLive();else netIdle()});
  window.addEventListener('online',function(){if(net.on)netLive();else netIdle()});
  (function(){var c=conn();if(c&&c.addEventListener)c.addEventListener('change',function(){netIdle()})})();
  // ---------- Warning beeps: when the line is so weak the call is about to cut ----------
  // Two short pips every few seconds (and a buzz on phones) while the connection stays Very poor
  // or drops. Played on this device only; it is never sent into the call. The audio context is
  // unlocked by the tap that starts/answers the call, because browsers block sound otherwise.
  var warn={ctx:null,iv:null,bad:0};
  function warnCtx(){
    try{
      if(!warn.ctx){var AC=window.AudioContext||window.webkitAudioContext;if(AC)warn.ctx=new AC()}
      if(warn.ctx&&warn.ctx.state==='suspended')warn.ctx.resume();
    }catch(e){}
  }
  function pip(){
    var c=warn.ctx;
    try{navigator.vibrate&&navigator.vibrate([120,80,120])}catch(e){}
    if(!c||c.state!=='running')return;
    var t=c.currentTime;
    [0,0.24].forEach(function(o){
      var osc=c.createOscillator(),g=c.createGain();
      osc.type='sine';osc.frequency.value=1000;
      g.gain.setValueAtTime(0.0001,t+o);
      g.gain.exponentialRampToValueAtTime(0.2,t+o+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t+o+0.15);
      osc.connect(g);g.connect(c.destination);
      osc.start(t+o);osc.stop(t+o+0.17);
    });
  }
  // Short vibrate + rising chime the moment the call connects.
  function connectCue(){
    try{navigator.vibrate&&navigator.vibrate([150,80,150,80,350])}catch(e){}
    var c=warn.ctx;
    if(!c||c.state!=='running')return;
    var t=c.currentTime;
    [[0,660],[0.14,880],[0.28,1175]].forEach(function(n){
      var o=c.createOscillator(),g=c.createGain();
      o.type='sine';o.frequency.value=n[1];
      g.gain.setValueAtTime(0.0001,t+n[0]);
      g.gain.exponentialRampToValueAtTime(0.3,t+n[0]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+n[0]+0.2);
      o.connect(g);g.connect(c.destination);o.start(t+n[0]);o.stop(t+n[0]+0.23);
    });
  }
  // ---------- Keep the call running when the screen locks (screen is NOT kept on, so no battery drain) ----------
  // 1) Media Session registers the call as active media, so Android treats it like music/a call and keeps
  //    the audio running with the screen off.
  // 2) While the page is hidden, the live-quality sampling is paused (saves battery, avoids false "weak signal" beeps).
  // 3) When the phone unlocks, the microphone is re-opened if the OS cut it, and audio + signalling are revived.
  function keepAwake(){
    try{
      if('mediaSession' in navigator){
        navigator.mediaSession.metadata=new MediaMetadata({title:'Live call with Esau',artist:'esauvictor.name.ng'});
        navigator.mediaSession.playbackState='playing';
        try{navigator.mediaSession.setActionHandler('hangup',function(){bye(function(){cleanup('Call ended.')})})}catch(e){}
      }
    }catch(e){}
  }
  function reviveMic(force){
    try{
      if(!call||!call.peerConnection||!stream)return;
      var tr=stream.getAudioTracks()[0];
      if(!force&&tr&&tr.readyState==='live'&&!tr.muted)return;   // phones mute the mic while asleep
      navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(ns){
        var snd=null;
        call.peerConnection.getSenders().forEach(function(x){if(x.track&&x.track.kind==='audio')snd=x});
        if(!snd||!call){ns.getTracks().forEach(function(t){t.stop()});return}
        return snd.replaceTrack(ns.getAudioTracks()[0]).then(function(){
          try{stream.getTracks().forEach(function(t){t.stop()})}catch(e){}
          stream=ns;
          var mb=document.getElementById('callMic');if(mb)mb.hidden=true;
          try{dc&&dc.open&&dc.send('back')}catch(e){}
        });
      }).catch(function(){
        // Browsers (iPhone especially) may only allow the mic to restart from a tap.
        var mb=document.getElementById('callMic');
        if(mb){mb.hidden=false;say('Your microphone paused while the phone slept. Tap the button below to turn it back on.')}
      });
    }catch(e){}
  }
  function showTip(){var t=document.getElementById('callTip');if(t&&window.matchMedia&&matchMedia('(pointer:coarse)').matches)t.hidden=false}
  // Tell the other side when this page goes to sleep, so they know why they cannot hear you.
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden'&&connected){try{dc&&dc.open&&dc.send('hidden')}catch(e){}}
  });
  function releaseAwake(){
    try{var mb=document.getElementById('callMic');if(mb)mb.hidden=true;var tp=document.getElementById('callTip');if(tp)tp.hidden=true}catch(e){}
    try{if('mediaSession' in navigator){navigator.mediaSession.playbackState='none';navigator.mediaSession.metadata=null}}catch(e){}
  }
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible'||!(wantCall||connected||!!call))return;
    keepAwake(); warnCtx(); try{dc&&dc.open&&dc.send('back')}catch(e){} try{var px=call&&call.peerConnection;if(connected&&px&&(px.iceConnectionState==='failed'||px.iceConnectionState==='closed'))recoverCall()}catch(e){} reviveMic(); net.prev=null; net.stall=0; if(connected)tryPlay();try{if(peer&&peer.disconnected)peer.reconnect()}catch(e){};
  });
  function warnStop(){clearInterval(warn.iv);warn.iv=null;warn.bad=0}
  // Called on every status update. Needs 2 bad readings in a row (about 4 s) so one blip never beeps.
  function warnUpdate(g,live){
    if(live&&(g==='bad'||g==='offline'))warn.bad++;else warn.bad=0;
    if(warn.bad>=2&&!warn.iv){pip();warn.iv=setInterval(pip,3500)}
    else if(warn.bad<2&&warn.iv){clearInterval(warn.iv);warn.iv=null}
  }
  // Extra line for connection-type failures, only when the network really looks weak.
  function hint(){
    if(net.grade==='offline')return 'You appear to be offline.';
    if(net.grade==='poor'||net.grade==='bad')return 'Your connection looks weak. Move '+where()+' and try again.';
    return '';
  }
  netIdle(); setInterval(netIdle,3000);
function say(m){$('s').textContent=m}
function cleanup(msg,h){
  var extra=h?hint():'';
  closing=true;
  clearTimeout(connT);clearTimeout(dT);
  try{dc&&dc.close()}catch(e){}
  if(call){try{call.close()}catch(e){}}
  if(peer){try{peer.destroy()}catch(e){}}
  if(stream){stream.getTracks().forEach(function(t){t.stop()})}
  peer=call=stream=dc=null; connected=ready=wantCall=false; recov=false; byeRx=false; maxTries=12; $('end').hidden=true;
  netLiveStop(); netIdle(); releaseAwake(); closing=false;
  if(msg)say(extra?msg+' '+extra:msg);
}
function getIce(){
  var ok=false; net.probeT0=performance.now(); net.probeMs=null; net.probeFail=false;
  return fetch(API+'/call/ice.php').then(function(r){ok=true;net.probeMs=performance.now()-net.probeT0;netIdle();return r.json()})
    .then(function(j){return j.iceServers&&j.iceServers.length?j.iceServers:FALLBACK_ICE})
    .catch(function(){if(!ok){net.probeFail=true;netIdle()}return FALLBACK_ICE});
}
function tryPlay(){$('a').play().catch(function(){})}
if(!/^v-[a-f0-9]{32}$/.test(target)){
  say('This link is invalid or incomplete. Use the link in the WhatsApp alert.');
}else{
  var age=sent?Math.round((Date.now()/1000-sent)/60):0;
  say(age>=3?'This request is '+age+' min old, so the visitor may have left. You can still try.':'A visitor is waiting. Tap Answer.');
  $('yes').hidden=false;
  // Connect to the signalling server NOW, while you read the page, so Answer is instant.
  getIce().then(function(ice){
    peer=new Peer({config:{iceServers:ice,iceCandidatePoolSize:4}});
    peer.on('open',function(){ready=true;if(wantCall&&stream)dial()});
    peer.on('disconnected',function(){try{peer&&peer.reconnect()}catch(e){}});
    peer.on('error',function(e){
      if(e.type==='peer-unavailable'){
        if(tries<maxTries){say((recov?'Reconnecting… ':'Visitor not ready yet… ')+'retrying ('+tries+'/'+maxTries+')');setTimeout(dial,1500)}
        else cleanup(recov?'The call could not be restored.':'The visitor has already left.');
      }else if(connected||recov){try{peer.reconnect()}catch(x){}}
      else cleanup('Connection problem ('+e.type+'). Reload this page and try again.',1);
    });
  });
}
$('yes').onclick=async function(){
  $('yes').hidden=true; warnCtx(); keepAwake(); say('Allowing microphone…');
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){say('Microphone blocked. Allow it in your browser settings, then reload this page.');$('yes').hidden=false;return}
  wantCall=true; say('Connecting…');
  if(ready)dial();
};
// Tell the other side "I hung up on purpose" so it ends at once instead of trying to reconnect.
function bye(then){
  var sent=false;
  try{if(dc&&dc.open){dc.send('bye');sent=true}}catch(e){}
  if(sent)setTimeout(then,250);else then();
}
// The line dropped (usually a phone slept and its network paused). Do not end: ring the visitor again automatically.
function recoverCall(){
  if(!connected||byeRx||recov||closing)return;
  recov=true; connected=false; netLiveStop(); clearTimeout(dT);
  var old=call; call=null;
  if(old){try{old.close()}catch(e){}}
  say('Connection lost. Reconnecting…'); $('end').hidden=false;
  tries=0; maxTries=40;
  try{if(peer&&peer.disconnected)peer.reconnect()}catch(e){}
  setTimeout(dial,1500);
}
function watch(c){
  var pc=c.peerConnection;
  clearTimeout(connT);
  connT=setTimeout(function(){if(!connected){if(recov&&tries<maxTries)setTimeout(dial,1500);else cleanup(recov?'The call could not be restored.':'Audio could not connect (network block). Ask the visitor to WhatsApp you.',1)}},30000);
  if(!pc)return;
  pc.addEventListener('iceconnectionstatechange',function(){
    if(c!==call||closing)return;
    var s=pc.iceConnectionState;
    if(s==='connected'||s==='completed'){
      net.disc=false; clearTimeout(dT);
      if(!connected){
        connected=true;recov=false;maxTries=12;clearTimeout(connT);connectCue();keepAwake();say('Connected. Talk now.');tryPlay();netLiveStart(pc);
        try{dc&&dc.close()}catch(e){}
        try{dc=peer.connect(target,{reliable:true});dc.on('data',function(d){
          if(d==='bye'&&!closing){byeRx=true;cleanup('Call ended.')}
          else if(d==='hidden'){say("The visitor's phone screen is off, so their microphone is paused. They can still hear you. Wait for them to wake the phone.")}
          else if(d==='back'){say('The visitor is back. Talk now.')}
        })}catch(e){}
      }
    }else if(s==='failed'){
      if(connected)recoverCall();
      else if(recov&&tries<maxTries)setTimeout(dial,1500);
      else cleanup(recov?'The call could not be restored.':'Audio could not connect (network block). Ask the visitor to WhatsApp you.',1);
    }else if(s==='disconnected'&&connected){
      say('Connection unstable…');net.disc=true;netLive();
      clearTimeout(dT);
      dT=setTimeout(function(){if(c===call&&connected&&pc.iceConnectionState!=='connected'&&pc.iceConnectionState!=='completed')recoverCall()},12000);
    }
  });
}
function dial(){
  if(!peer||peer.destroyed||!stream||closing)return;
  var tr=stream.getAudioTracks()[0];
  if(tr&&tr.readyState==='ended'){ // the phone cut the mic while asleep: open it again, then dial
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(ns){
      if(ns.getAudioTracks()[0].readyState!=='live'){cleanup('Microphone lost. Reload this page and try again.');return}
      stream=ns;dial();
    }).catch(function(){cleanup('Microphone lost. Reload this page and try again.')});
    return;
  }
  tries++;
  var o=call; call=null;
  if(o){try{o.close()}catch(e){}}
  var c=peer.call(target,stream);
  call=c;
  say(recov?'Reconnecting…':'Calling visitor…'); $('end').hidden=false;
  watch(c);
  c.on('stream',function(rs){$('a').srcObject=rs;tryPlay();if(!connected)say('Connecting audio…')});
  c.on('close',function(){if(c!==call||closing||byeRx)return;if(connected)recoverCall()});
}
$('end').onclick=function(){bye(function(){cleanup('Call ended.')})};
</script></body></html>
