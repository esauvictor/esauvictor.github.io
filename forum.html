const API='https://esauvictor.name.ng/api/forum.php';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN='',NAME='',CATS=[],CAT='',PAGE=1;
try{TOKEN=localStorage.getItem('forum_token')||'';NAME=localStorage.getItem('forum_name')||''}catch(e){}
function save(){try{TOKEN?localStorage.setItem('forum_token',TOKEN):localStorage.removeItem('forum_token');NAME?localStorage.setItem('forum_name',NAME):localStorage.removeItem('forum_name')}catch(e){}}
function ago(i){const s=Math.max(0,(Date.now()-Date.parse(i))/1000);if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';if(s<2592000)return Math.floor(s/86400)+' d ago';return new Date(i).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'})}
async function call(action,data,method){
  const h={'Content-Type':'application/json'};if(TOKEN)h.Authorization='Bearer '+TOKEN;
  let r;
  if(method==='GET'){r=await fetch(API+'?'+new URLSearchParams({a:action,...data}),{headers:TOKEN?{Authorization:'Bearer '+TOKEN}:{}})}
  else r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify({action,...data})});
  const j=await r.json().catch(()=>({}));

}

// anti-spam puzzle: the browser finds a number n so that sha256(challenge:n) starts with 4 hex zeros (about a second, solved while the person types)
let POW=null;
async function solvePow(){
  const j=await call('challenge',{},'GET');const enc=new TextEncoder();
  for(let n=0;;n++){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(j.c+':'+n)));if(h[0]===0&&h[1]===0)return{c:j.c,n:String(n)}}
}
function startPow(){POW=solvePow().catch(()=>null)}

    T.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
      const kind=b.dataset.edit,eid=+b.dataset.id,box=kind==='topic'?$('#tb'):b.closest('.reply').querySelector('[data-body]');
      const cur=kind==='topic'?t.body:d.replies.find(r=>r.id===eid).body;
      box.outerHTML='<div id="ed">'+(kind==='topic'?'<label>Title</label><input id="et" maxlength="120" value="'+esc(t.title)+'">':'')+'<label>Your post</label><textarea id="eb" maxlength="5000">'+esc(cur)+'</textarea><button id="es" style="margin-top:.8rem">Save</button> <button class="ghost" id="ec" style="margin-top:.8rem">Cancel</button><p class="msg" id="em"></p></div>';
      $('#ec').onclick=()=>viewTopic(tid);
      $('#es').onclick=async()=>{$('#es').disabled=true;try{await call('edit',{kind,id:eid,title:kind==='topic'?$('#et').value:undefined,body:$('#eb').value});viewTopic(tid)}catch(x){$('#em').className='msg err';$('#em').textContent=x.message;$('#es').disabled=false}};
    });
  }catch(x){$('#tp').innerHTML='<p class="msg err">'+esc(x.message)+'</p>'}
}

function settingsPanel(p,root){
  const sec=(i,t,d,body)=>'<section class="card set"><div class="sh"><span class="si">'+ico(i,18)+'</span><div><b>'+t+'</b><p class="sub" style="margin:0">'+d+'</p></div></div>'+body+'</section>';
  root.innerHTML=
   sec('edit','Public profile','Shown to everyone on your profile.','<label>About you (200 characters)</label><textarea id="pbio" maxlength="200" style="min-height:80px"></textarea><label>Website (optional, starts with https://)</label><input id="pweb" autocapitalize="none"><label>GitHub username (optional)</label><input id="pgh" autocapitalize="none"><button id="psv" style="margin-top:1rem">Save profile</button><p class="msg" id="pm1"></p>')
  +sec('cap','Student badge',p.student?'You are verified as a student.':'Show a Student badge on your posts.',p.student?'<span class="badge">Student</span>':'<label>Class</label><select id="scl"><option value="">Loading…</option></select><label>Class code (the one you use to unlock lessons)</label><input id="scd" autocapitalize="characters" autocomplete="off"><button id="svf" style="margin-top:1rem">Verify</button><p class="msg" id="pm2"></p>')
  +sec('lock','Password','Use at least 8 characters.','<label>Current password</label><input id="pw1" type="password" autocomplete="current-password"><label>New password</label><input id="pw2" type="password" autocomplete="new-password"><button id="ppw" style="margin-top:1rem">Change password</button><p class="msg" id="pm3"></p>')
  +sec('out','Session','Signed in as '+esc(p.name)+'.','<button type="button" class="ghost" id="pso">'+ico('out')+' Sign out</button>');
  const mm=(id,t,k)=>{const e=$(id);e.className='msg '+(k||'');e.textContent=t||''};
  $('#pbio').value=p.bio||'';$('#pweb').value=p.website||'';$('#pgh').value=p.github||'';
  $('#psv').onclick=async()=>{const b=$('#psv');b.disabled=true;try{await call('profile_save',{bio:$('#pbio').value,website:$('#pweb').value,github:$('#pgh').value});mm('#pm1','Saved.','ok');setTimeout(()=>route(),700)}catch(x){mm('#pm1',x.message,'err');b.disabled=false}};
  if($('#svf')){fetch('https://esauvictor.name.ng/api/classes.php').then(r=>r.json()).then(d=>{$('#scl').innerHTML='<option value="">Choose your class…</option>'+(d.classes||[]).filter(c=>c.has_code).map(c=>'<option value="'+esc(c.slug)+'">'+esc(c.title)+'</option>').join('')}).catch(()=>{$('#scl').innerHTML='<option value="">Could not load classes</option>'});
    $('#svf').onclick=async()=>{const b=$('#svf');b.disabled=true;try{await call('verify_student',{slug:$('#scl').value,code:$('#scd').value});mm('#pm2','Verified. Your Student badge will now show.','ok');setTimeout(()=>route(),900)}catch(x){mm('#pm2',x.message,'err');b.disabled=false}}}
  $('#ppw').onclick=async()=>{const b=$('#ppw');b.disabled=true;try{await call('change_password',{password:$('#pw1').value,new_password:$('#pw2').value});mm('#pm3','Password changed.','ok');$('#pw1').value='';$('#pw2').value='';b.disabled=false}catch(x){mm('#pm3',x.message,'err');b.disabled=false}};
  $('#pso').onclick=()=>$('#out').click();
}
async function viewProfile(name){
  $('#main').innerHTML='<div class="top"><div><a href="forum" id="bk">← All topics</a></div><div class="me" id="me"></div></div><div id="auth" class="card hide"></div><div id="tp"><p class="sub">Loading…</p></div>';
  renderTop();$('#bk').onclick=e=>{e.preventDefault();go('forum')};loadUnread();
  try{const p=await call('profile',{u:name},'GET');document.title=p.name+' — Forum';
    const mine=TOKEN&&NAME===p.name,h=hue(p.name),lv=level(p),ext=[];
    if(p.website)ext.push('<a class="chiplink" href="'+esc(p.website)+'" target="_blank" rel="nofollow ugc noopener">'+ico('globe',15)+' Website</a>');
    if(p.github)ext.push('<a class="chiplink" href="https://github.com/'+encodeURIComponent(p.github)+'" target="_blank" rel="nofollow ugc noopener">'+ico('gh',15)+' GitHub</a>');
    const days=Math.max(0,Math.floor((Date.now()-Date.parse(p.joined))/864e5));
    let wel='';
    if(mine){const k=[[!!p.bio,'Write a short bio'],[p.topics>0,'Post your first topic'],[p.replies>0,'Help someone with a reply']],d=k.filter(x=>x[0]).length;
      wel='<div class="welcome"><h3>Welcome, '+esc(p.name)+'!</h3><p class="sub">'+(d===3?'You are all set. Thanks for helping the community grow.':'Glad you are here. Finish setting up your profile:')+'</p><ul>'+k.map(x=>'<li class="'+(x[0]?'ok':'')+'">'+ico(x[0]?'check':'circ',16)+' '+x[1]+'</li>').join('')+'</ul><p style="margin-top:.8rem"><button class="sm" id="pedit">Edit my profile</button></p></div>'}
    const ovh=wel+'<div class="card pf" style="--c1:hsl('+h+',70%,45%);--c2:hsl('+((h+60)%360)+',70%,30%)"><div class="cover"></div><div class="in">'+av(p.name,84)+'<h1 style="font-size:1.5rem;overflow-wrap:anywhere">'+esc(p.name)+badge(p)+' <span class="lvl">'+lv+'</span></h1><div class="meta">Joined '+new Date(p.joined).toLocaleDateString('en-NG',{month:'long',year:'numeric'})+(days<1?' · new today':' · '+days+' day'+(days===1?'':'s')+' ago')+(p.last_active?' · active '+ago(p.last_active):'')+'</div>'
      +(p.bio?'<div class="body">'+esc(p.bio)+'</div>':'<p class="sub">'+(mine?'You have not written a bio yet.':'This member has not added a bio yet.')+'</p>')
      +'<div class="stats"><div><b>'+p.topics+'</b>topics</div><div><b>'+p.replies+'</b>replies</div><div><b>'+p.best_answers+'</b>best answers</div></div>'
      +(ext.length?'<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem">'+ext.join('')+'</div>':'')+'</div></div>'
      +'<b>Recent topics</b>'+(p.recent.length?p.recent.map(t=>'<a class="t" href="forum?t='+t.id+'" data-t="'+t.id+'"><b>'+esc(t.title)+'</b><div class="meta"><span>'+t.replies+' repl'+(t.replies===1?'y':'ies')+'</span><span>'+ago(t.created_at)+'</span></div></a>').join(''):'<p class="sub">No topics yet.</p>')
      +((p.recent_replies||[]).length?'<div class="card"><b>Recent replies</b>'+p.recent_replies.map(r=>'<a class="rp" href="forum?t='+r.topic_id+'" data-t="'+r.topic_id+'">'+esc(r.body)+'<i>on “'+esc(r.title)+'” · '+ago(r.created_at)+'</i></a>').join('')+'</div>':'');
    $('#tp').innerHTML=mine?'<div class="tabs"><button type="button" class="tab on" data-tb="ov">'+ico('grid')+' Overview</button><button type="button" class="tab" data-tb="st">'+ico('gear')+' Settings</button></div><div id="pov">'+ovh+'</div><div id="pst" class="hide"></div>':ovh;
    if(mine){const sw=k=>{$('#pov').classList.toggle('hide',k!=='ov');$('#pst').classList.toggle('hide',k!=='st');$('#tp').querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tb===k));if(k==='st'&&!$('#pst').dataset.r){$('#pst').dataset.r=1;settingsPanel(p,$('#pst'))}};
      $('#tp').querySelectorAll('.tab').forEach(t=>t.onclick=()=>sw(t.dataset.tb));const pe=$('#pedit');if(pe)pe.onclick=()=>{sw('st');window.scrollTo(0,0)};if(Q().get('tab')==='settings')sw('st')}
    $('#tp').querySelectorAll('a[data-t]').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.getAttribute('href'))});
  }catch(x){$('#tp').innerHTML='<p class="msg err">'+esc(x.message)+'</p>'}
}

async function route(){
  document.title='Community Forum — Esau Victor';
  let s;try{s=await call('status',{},'GET')}catch(x){s={enabled:false}}
  if(!s.enabled){$('#main').innerHTML='<div style="padding:3rem 0"><h1>The forum is closed right now</h1><p class="sub">Please check back soon. In the meantime, you can read the <a href="blog">blog</a> or see the <a href="classes">classes</a>.</p></div>';return}
  CATS=s.categories||[];
  const t=parseInt(id(),10),u=Q().get('u');t?viewTopic(t):u?viewProfile(u):viewList();
}
window.onpopstate=route;route();
</script>
