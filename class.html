<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Class — Esau Victor</title>
<meta name="description" content="Live and recorded web development classes by Esau Victor.">
<link rel="icon" href="https://avatars.githubusercontent.com/u/94287719?v=4" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Oxanium:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--mono:'Source Sans 3','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;--code:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--display:'Archivo','Source Sans 3','Segoe UI',system-ui,sans-serif;--bg:#0c0a08;--bg1:#131009;--bg2:#1a150e;--border:rgba(255,120,40,.14);--border2:rgba(255,120,40,.28);--green:#ff7828;--text:#f5ede4;--text2:#d3c6b6;--text3:#948575}
html{scroll-behavior:smooth}body{background:var(--bg);color:var(--text);font-family:var(--mono);line-height:1.6;min-height:100vh}
a{color:var(--green)}.wrap{max-width:980px;margin:0 auto;padding:0 1.2rem}
.nav{position:sticky;top:0;z-index:200;background:rgba(12,10,8,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.2rem;gap:1rem}
.logo{font:700 1.1rem var(--display);color:var(--text);text-decoration:none}.logo em{color:var(--green);font-style:normal}
.nav ul{display:flex;gap:1.2rem;list-style:none;font-size:.78rem}.nav ul a{color:var(--text2);text-decoration:none}.nav ul a:hover,.nav ul a.on{color:var(--green)}
h1{font:700 clamp(1.7rem,6vw,2.6rem)/1.15 var(--display)}h2{font:700 1.2rem var(--display);margin:2rem 0 .8rem}
.hero{padding:2.2rem 0 1rem}.cover{aspect-ratio:16/7;border-radius:14px;background:linear-gradient(135deg,#2a1d10,#4a2a12) center/cover;border:1px solid var(--border);margin-bottom:1.3rem}
.sub{color:var(--text2);margin-top:.6rem;max-width:680px;font-size:.92rem}
.facts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.1rem}.fact{border:1px solid var(--border2);background:var(--bg1);border-radius:999px;padding:.38rem .85rem;font-size:.76rem}.fact b{color:var(--green)}
.tag{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .6rem;border-radius:999px;background:#22c55e;color:#052e16;margin-bottom:.7rem}.tag.closed,.tag.completed{background:#6b5b4d;color:#fff}.tag.full{background:#ef4444;color:#fff}
.desc p{margin:0 0 .9rem;color:var(--text2);font-size:.9rem}.desc ul{margin:0 0 .9rem 1.3rem;color:var(--text2);font-size:.9rem}.desc strong{color:var(--text)}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:14px;padding:1.2rem;margin:1rem 0}
label{display:block;font-size:.74rem;color:var(--text2);margin:.9rem 0 .3rem}
input,select,textarea{width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:.75rem;font:inherit;font-size:.88rem}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}@media(max-width:560px){.row2{grid-template-columns:1fr}.nav ul{gap:.8rem}}
button.go,a.go{display:inline-block;margin-top:1.1rem;background:var(--green);color:#1a0f04;border:0;border-radius:8px;padding:.8rem 1.4rem;font:700 .85rem var(--mono);cursor:pointer;text-decoration:none}
button.go:disabled{opacity:.5}.ghost{background:transparent!important;color:var(--text)!important;border:1px solid var(--border2)!important}
.msg{margin-top:.8rem;font-size:.84rem;min-height:1.3em}.msg.err{color:#f87171}.msg.ok{color:#4ade80}
.lesson{display:flex;align-items:center;gap:.8rem;padding:.8rem .2rem;border-top:1px solid var(--border);color:var(--text);text-decoration:none;font-size:.88rem}.lesson:first-child{border:0}
.lesson i{width:1.2rem;text-align:center;color:var(--text3)}.lesson.open i{color:#22c55e}.lesson span.n{color:var(--text3);width:1.5rem}.lesson em{margin-left:auto;font-style:normal;font-size:.68rem;color:var(--green)}
.lesson:hover{color:var(--green)}.pay{white-space:pre-line;background:var(--bg2);border-left:3px solid var(--green);border-radius:6px;padding:.9rem;font-size:.85rem;margin:.8rem 0}
footer{border-top:1px solid var(--border);margin-top:3rem;padding:1.6rem 0 2.2rem;text-align:center;font-size:.74rem;color:var(--text2)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.2em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.fact .ic{color:var(--green);margin-right:.2rem}.card>b .ic{width:1.25em;height:1.25em;color:var(--green);margin-right:.25rem}#cd .ic{color:var(--green)}
.vidc{padding:.6rem}.yt{position:relative;padding-top:56.25%}.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px}.vidc video{width:100%;max-height:70vh;border-radius:10px;background:#000;display:block}

/* code-like bits stay monospace */
pre,code,kbd,samp{font-family:var(--code)}
.terminal-block,.terminal-block *,.sec-num,.hero-role,.profile-tag,.project-index,.terminal-path,.t-prompt,.t-cmd,.t-key,.t-str,.t-val,.t-comment,.wv-bar{font-family:var(--code)!important}
body{-webkit-font-smoothing:antialiased}

/* typography: bold Archivo headings, Source Sans 3 body, bigger and brighter text */
html{font-size:106.25%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-weight:500}
h1,h2,h3,h4,.sec-title,.hero-name{font-family:var(--display);font-weight:800;letter-spacing:-.015em}
.btn,button{font-weight:700}
.nav-links a,.nav ul a{font-weight:600}
@media(min-width:1241px){.nav-links a{font-size:.86rem;letter-spacing:.01em}}
.hero-desc{font-size:1.05rem;line-height:1.7}
.sec-num{font-size:.8rem}
</style>
</head>
<body>
<nav class="nav"><div class="wrap"><a class="logo" href="/">esau<em>.</em>victor<em>()</em></a><ul><li><a href="/">Home</a></li><li><a href="blog">Blog</a></li><li><a href="classes" class="on">Classes</a></li><li><a href="/#contact">Contact</a></li></ul></div></nav>
<main class="wrap" id="main"><p class="sub" style="padding:2rem 0">Loading…</p></main>
<script>
const API='https://esauvictor.name.ng/api';
const slug=new URLSearchParams(location.search).get('c')||'';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const IC={cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0116 0z"/><circle cx="12" cy="10" r="3"/>',hour:'<path d="M5 22h14M5 2h14M17 22v-4.17a2 2 0 00-.59-1.42L12 12l-4.41 4.41A2 2 0 007 17.83V22M7 2v4.17a2 2 0 00.59 1.42L12 12l4.41-4.41A2 2 0 0017 6.17V2"/>',live:'<circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 010 8.49M7.76 16.24a6 6 0 010-8.49M19.07 4.93a10 10 0 010 14.14M4.93 19.07a10 10 0 010-14.14"/>',ok:'<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/>',spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 3v4M21 5h-4"/>'};
function ic(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}
function fmt(t){const f=window.SiteFmt;return f?f(t):'<p>'+esc(t)+'</p>'}
function when(i){try{return new Date(i).toLocaleString('en-NG',{timeZone:'Africa/Lagos',weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true})+' (Lagos)'}catch(e){return ''}}
function span(ms){const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,'0');return (d?d+'d ':'')+p(h)+'h '+p(m)+'m '+p(x)+'s'}
let D=null;
function code(){try{return sessionStorage.getItem('classcode:'+slug)||''}catch(e){return ''}}
function lessons(unlocked){
  const L=D.class.lessons;
  if(!L.length)return '<p class="sub">Lessons will appear here.</p>';
  return L.map((l,i)=>{const open=!l.locked||unlocked;return '<a class="lesson '+(open?'open':'')+'" target="_self" href="post?slug='+encodeURIComponent(l.slug)+'"><span class="n">'+(i+1)+'</span><i class="fas '+(open?'fa-play-circle':'fa-lock')+'"></i><span>'+esc(l.title)+'</span>'+(l.free_preview?'<em>FREE PREVIEW</em>':'')+'</a>'}).join('');
}
function videoHtml(v){
  if(!v||!(v.url||v.embed))return '';
  const vl=esc(v.label||'Class video');
  const body=v.embed&&/^https:\/\/www\.youtube-nocookie\.com\/embed\/[A-Za-z0-9_-]{11}/.test(v.embed)
    ?'<div class="yt"><iframe src="'+esc(v.embed)+'" title="'+vl+'" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>'
    :'<video controls playsinline preload="metadata" src="'+esc(v.url||'')+'" aria-label="'+vl+'"></video>';
  return '<h2>'+vl+'</h2><div class="card vidc">'+body+'</div>';
}
function render(){
  const c=D.class,p=D.pay,canReg=c.status==='open'&&!c.full;
  const tag=c.full?'full':c.status,label=c.full?'Full':{open:'Enrollment open',closed:'Enrollment closed',completed:'Completed'}[c.status];
  document.title=c.title+' — Esau Victor';
  try{ // search-engine details: description, canonical link and Course data (Google runs this page's script)
    const dsc=(c.summary||c.description||'').replace(/\s+/g,' ').slice(0,200);
    const setM=(sel,mk,v)=>{let e=document.head.querySelector(sel);if(!e){e=document.createElement(mk);document.head.appendChild(e)}return e};
    const md=setM('meta[name=description]','meta');md.setAttribute('name','description');md.setAttribute('content',dsc||'Web development class by Esau Victor.');
    const cn=setM('link[rel=canonical]','link');cn.setAttribute('rel','canonical');cn.setAttribute('href','https://esauvictor.name.ng/class?c='+encodeURIComponent(c.slug));
    const ld={'@context':'https://schema.org','@type':'Course',name:c.title,description:dsc||c.title,provider:{'@type':'Person',name:'Esau Victor',url:'https://esauvictor.name.ng/'},url:cn.href};
    if(c.cover_image_url)ld.image=c.cover_image_url;
    ld.offers={'@type':'Offer',category:c.price_kobo>0?'Paid':'Free',price:String(c.price_kobo/100),priceCurrency:'NGN',availability:c.status==='open'&&!c.full?'https://schema.org/InStock':'https://schema.org/SoldOut',url:cn.href};
    if(c.starts_at)ld.hasCourseInstance={'@type':'CourseInstance',courseMode:'online',startDate:c.starts_at,...(c.duration_min?{courseWorkload:'PT'+c.duration_min+'M'}:{})};
    let sc=document.getElementById('ldc');if(!sc){sc=document.createElement('script');sc.id='ldc';sc.type='application/ld+json';document.head.appendChild(sc)}
    sc.textContent=JSON.stringify(ld).replace(/</g,'\\u003c');
  }catch(e){}
  const facts=['<span class="fact"><b>'+esc(c.price_label)+'</b></span>'];
  if(c.starts_at)facts.push('<span class="fact">'+ic('cal')+' '+esc(when(c.starts_at))+'</span>');
  if(c.duration_min)facts.push('<span class="fact">'+ic('clock')+' '+c.duration_min+' min</span>');
  if(c.venue)facts.push('<span class="fact">'+ic('pin')+' '+esc(c.venue)+'</span>');
  if(c.spots_left!=null)facts.push('<span class="fact"><b>'+c.spots_left+'</b> spots left</span>');
  let h='<section class="hero">'+(c.cover_image_url?'<div class="cover" style="background-image:url(\''+esc(c.cover_image_url)+'\')"></div>':'')+'<span class="tag '+tag+'">'+label+'</span><h1>'+esc(c.title)+'</h1><p class="sub">'+esc(c.summary)+'</p>'
    +'<div class="facts">'+facts.join('')+'<span class="fact" id="cd" hidden></span></div></section>';
  if(c.description)h+='<div class="desc">'+fmt(c.description)+'</div>';
  h+='<div id="vslot">'+videoHtml(c.video)+'</div>';
  h+='<h2>Lessons</h2><div class="card" id="ls">'+lessons(false)+'</div>';
  if(c.has_code)h+='<div class="card"><b>Already registered?</b><p class="sub">Enter the class code from your confirmation email to unlock every lesson.</p><form id="uf" style="display:flex;gap:.6rem;margin-top:.7rem"><input id="uc" placeholder="Class code" autocomplete="off" autocapitalize="characters" required><button class="go" style="margin:0">Unlock</button></form><div class="msg" id="um"></div></div>';
  if(canReg)h+='<h2>Enroll in this class</h2><form class="card" id="rf"><input type="checkbox" name="botcheck" style="display:none" tabindex="-1"><div class="row2"><div><label>Full name</label><input name="fullName" required autocomplete="name"></div><div><label>Email</label><input name="email" type="email" required autocomplete="email"></div></div><div class="row2"><div><label>Phone / WhatsApp</label><input name="phone" type="tel" required autocomplete="tel" placeholder="0803…"></div><div><label>Experience</label><select name="experience" required><option value="">Choose…</option><option>Complete beginner</option><option>Some experience</option><option>Intermediate</option><option>Advanced</option></select></div></div><label>Anything else? (optional)</label><textarea name="comments" rows="3"></textarea><button class="go" id="rb">Register'+(c.price_kobo?' — '+esc(c.price_label):'')+'</button><div class="msg" id="rm"></div></form><div id="done"></div>';
  document.getElementById('main').innerHTML=h;
  if(c.starts_at){const e=document.getElementById('cd');const t=()=>{const l=new Date(c.starts_at)-Date.now();e.hidden=false;e.innerHTML=l>0?ic('hour')+' starts in <b>'+span(l)+'</b>':ic('live')+' <b>started</b>'};t();setInterval(t,1000)}
  wire();
  if(code()&&c.has_code)unlock(code(),true);
}
async function unlock(cd,silent){
  const m=document.getElementById('um');
  try{const r=await fetch(API+'/class_unlock.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug,code:cd})});const d=await r.json().catch(()=>({}));
    if(r.ok&&d.ok){try{sessionStorage.setItem('classcode:'+slug,cd)}catch(e){}document.getElementById('ls').innerHTML=lessons(true);const vs=document.getElementById('vslot');if(vs&&d.video)vs.innerHTML=videoHtml(d.video);if(m){m.className='msg ok';m.textContent='Unlocked. Pick a lesson above.'}return}
    try{sessionStorage.removeItem('classcode:'+slug)}catch(e){}
    if(m&&!silent){m.className='msg err';m.textContent=d.error||'Could not check the code.'}
  }catch(e){if(m&&!silent){m.className='msg err';m.textContent='Could not reach the server.'}}
}
function showCode(cd,regId){
  const dn=document.getElementById('done');
  dn.innerHTML='<div class="card"><b>'+ic('spark')+' You are in! (Reg #'+regId+')</b>'+(cd?'<p class="sub">Your class code:</p><p style="font:700 1.8rem var(--mono);letter-spacing:.25em;color:var(--green);margin:.4rem 0">'+esc(cd)+'</p><p class="sub">It is also in your email. The lessons are unlocked on this device now.</p>':'<p class="sub">Check your email for the details.</p>')+'</div>';
  if(cd){try{sessionStorage.setItem('classcode:'+slug,cd)}catch(e){}unlock(cd,true)}
}
function loadPaystack(){return new Promise((ok,no)=>{if(window.PaystackPop)return ok();const s=document.createElement('script');s.src='https://js.paystack.co/v2/inline.js';s.onload=ok;s.onerror=()=>no(new Error('x'));document.head.appendChild(s)})}
async function payNow(ps,regId){
  const m=document.getElementById('pm');
  try{await loadPaystack()}catch(e){if(m){m.className='msg err';m.textContent='Could not load the payment window. Check your connection and tap Pay again.'}return}
  new PaystackPop().resumeTransaction(ps.access_code,{
    onSuccess:async()=>{if(m){m.className='msg';m.textContent='Confirming your payment…'}
      for(let i=0;i<4;i++){try{const r=await fetch(API+'/class_verify.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:ps.reference})});const d=await r.json().catch(()=>({}));if(r.ok&&d.ok){showCode(d.access_code,regId);return}}catch(e){}await new Promise(r=>setTimeout(r,2500))}
      if(m){m.className='msg err';m.textContent='Payment received but not confirmed yet. Your code will be emailed shortly.'}},
    onCancel:()=>{if(m){m.className='msg err';m.textContent='Payment not completed. Tap Pay to try again.'}}
  });
}
function wire(){
  const uf=document.getElementById('uf');if(uf)uf.onsubmit=e=>{e.preventDefault();unlock(document.getElementById('uc').value.trim())};
  const rf=document.getElementById('rf');if(!rf)return;
  rf.onsubmit=async e=>{e.preventDefault();const b=document.getElementById('rb'),m=document.getElementById('rm');b.disabled=true;m.className='msg';m.textContent='Enrolling…';
    const body=Object.fromEntries(new FormData(rf));body.class=slug;body.botcheck=rf.botcheck.checked?'1':'';
    try{const r=await fetch(API+'/class_register.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));
      if(!r.ok||!d.success){m.className='msg err';m.textContent=d.error||'Something went wrong. Please try again.';b.disabled=false;return}
      const p=d.pay||{};rf.hidden=true;
      const bank=p.account_no?'<p class="sub" style="margin-top:1rem">Prefer a bank transfer?</p><div class="pay">Bank: '+esc(p.bank_name)+'\nAccount number: '+esc(p.account_no)+'\nAccount name: '+esc(p.account_name)+'\nAmount: '+esc(p.price_label)+'</div><a class="go ghost" target="_blank" rel="noopener" href="https://wa.me/'+esc(p.whatsapp)+'?text='+encodeURIComponent('Hello, proof of payment for '+D.class.title+' (Reg #'+d.regId+')')+'">Send proof on WhatsApp</a>':'';
      const dn=document.getElementById('done');
      if(d.free){showCode(d.access_code,d.regId);return}
      if(d.paystack){
        const pay=()=>payNow(d.paystack,d.regId);
        dn.innerHTML='<div class="card"><b>'+ic('ok')+' Enrolled (Ref #'+d.regId+')</b><p class="sub">One last step: pay '+esc(p.price_label)+' securely with Paystack (card, bank transfer or USSD). Your class code appears here and in your email as soon as the payment goes through.</p><button class="go" id="pn">Pay '+esc(p.price_label)+' now</button><div class="msg" id="pm"></div>'+bank+'</div>';
        document.getElementById('pn').onclick=pay;pay();return;
      }
      dn.innerHTML='<div class="card"><b>'+ic('ok')+' You are registered (Reg #'+d.regId+')</b><p class="sub">We sent the details to your email.</p>'+(p.account_no?'<div class="pay">Bank: '+esc(p.bank_name)+'\nAccount number: '+esc(p.account_no)+'\nAccount name: '+esc(p.account_name)+'\nAmount: '+esc(p.price_label)+'</div>':'')+'<p class="sub">'+esc(p.note||'')+'</p><a class="go" target="_blank" rel="noopener" href="https://wa.me/'+esc(p.whatsapp)+'?text='+encodeURIComponent('Hello, proof of payment for '+D.class.title+' (Reg #'+d.regId+')')+'">Send proof on WhatsApp</a></div>';
    }catch(err){m.className='msg err';m.textContent='Could not reach the server.';b.disabled=false}};
}
fetch(API+'/classes.php?slug='+encodeURIComponent(slug)).then(r=>r.ok?r.json():Promise.reject()).then(d=>{D=d;render()}).catch(()=>{document.getElementById('main').innerHTML='<p class="sub" style="padding:2rem 0">This class could not be found. <a href="classes">See all classes</a></p>'});
</script>
<footer><div class="wrap">© <span id="year"></span> <span>esau victor</span> · <a href="privacy">Privacy</a></div></footer>
<script>document.getElementById('year').textContent=new Date().getFullYear();</script>
<script src="https://esauvictor.name.ng/api/site.js" defer></script>
<script>/* shows the Forum link only while the forum is switched on in the admin */
fetch('https://esauvictor.name.ng/api/forum.php').then(function(r){return r.json()}).then(function(j){if(!j||!j.enabled)return;var ul=document.querySelector('#navLinks, .nav ul');if(!ul||ul.querySelector('a[href="forum"]'))return;var li=document.createElement('li');li.innerHTML='<a href="forum">forum</a>';var c=ul.querySelector('a[href*="contact"]');c&&c.parentNode.parentNode===ul?ul.insertBefore(li,c.parentNode):ul.appendChild(li)}).catch(function(){});</script>
<script>/* "Discuss this class" link while the forum is on */
(function(){var n=0,t=setInterval(function(){n++;if(n>60){clearInterval(t);return}if(typeof D==='undefined'||!D||!D.class)return;clearInterval(t);
fetch('https://esauvictor.name.ng/api/forum.php').then(function(r){return r.json()}).then(function(j){if(!j||!j.enabled)return;var m=document.getElementById('main');if(!m||document.getElementById('fmLink'))return;var a=document.createElement('div');a.id='fmLink';a.className='card';a.innerHTML='<b>Questions about this class?</b><p class="sub">Ask in the community forum and get help from me and other students.</p><a class="go" href="forum?class='+encodeURIComponent(D.class.slug)+'">Discuss this class</a>';m.appendChild(a)}).catch(function(){})},500)})();</script>
