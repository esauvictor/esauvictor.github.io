<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Status | Esau Victor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    -webkit-font-smoothing: antialiased;
  }

  .status-card {
    width: 100%;
    max-width: 400px;
    aspect-ratio: 9 / 16;
    background: linear-gradient(160deg, #0a1628 0%, #0f1f3d 50%, #1e3a8a 100%);
    border-radius: 20px;
    padding: 3rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    color: #ffffff;
  }

  /* subtle radial glow top-right */
  .status-card::before {
    content: '';
    position: absolute;
    top: -20%;
    right: -20%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(59,130,246,0.25) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  /* subtle radial glow bottom-left */
  .status-card::after {
    content: '';
    position: absolute;
    bottom: -20%;
    left: -20%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(126,231,135,0.12) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
    width: 100%;
  }

  /* AVATAR */
  .avatar-wrap {
    position: relative;
    margin-bottom: 0.75rem;
  }

  .avatar-wrap img {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 3px solid #7ee787;
    object-fit: cover;
    box-shadow: 0 0 0 6px rgba(126,231,135,0.15);
    display: block;
  }

  /* BRAND */
  .brand-name {
    font-size: 1rem;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.3px;
  }

  .brand-tagline {
    font-size: 0.78rem;
    color: #7ee787;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  /* DIVIDER */
  .divider {
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, #3b82f6, #7ee787);
    border-radius: 2px;
    margin: 0.5rem 0;
  }

  /* HEADLINE */
  .headline {
    font-size: 1.65rem;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.5px;
    color: #ffffff;
    padding: 0 0.5rem;
  }

  .headline .accent {
    color: #7ee787;
    display: block;
  }

  /* SUBTITLE */
  .subtitle {
    font-size: 0.9rem;
    color: #94a3b8;
    line-height: 1.4;
    max-width: 90%;
  }

  /* CLASS INFO BOX */
  .info-box {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(126,231,135,0.25);
    border-radius: 14px;
    padding: 1.1rem 1.5rem;
    width: 100%;
    max-width: 280px;
    margin: 0.35rem 0;
    backdrop-filter: blur(6px);
  }

  .info-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-size: 0.95rem;
    font-weight: 600;
    color: #ffffff;
  }

  .info-row + .info-row {
    margin-top: 0.55rem;
    padding-top: 0.55rem;
    border-top: 1px dashed rgba(126,231,135,0.2);
  }

  .info-row .price {
    font-size: 1.15rem;
    color: #7ee787;
    font-weight: 800;
  }

  .info-row .label {
    color: #ffffff;
    font-weight: 700;
  }

  /* CTA */
  .cta-line {
    font-size: 0.85rem;
    color: #94a3b8;
    font-weight: 500;
    margin-top: 0.3rem;
  }

  .link-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    background: linear-gradient(135deg, #3b82f6, #1e3a8a);
    color: #ffffff;
    padding: 0.65rem 1.2rem;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.2px;
    box-shadow: 0 8px 20px -6px rgba(59,130,246,0.5);
    margin-top: 0.5rem;
  }

  .link-pill i {
    font-size: 0.75rem;
  }

  /* FOOTER SIGNATURE */
  .signature {
    position: absolute;
    bottom: 1.75rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.72rem;
    color: #64748b;
    letter-spacing: 0.3px;
  }

  .signature strong {
    color: #94a3b8;
    font-weight: 700;
  }

  /* Emoji replacement — using simple styled elements */
  .icon-calendar,
  .icon-money {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    font-size: 0.72rem;
    font-weight: 800;
    flex-shrink: 0;
  }

  .icon-calendar {
    background: linear-gradient(135deg, #3b82f6, #1e3a8a);
    color: #ffffff;
  }

  .icon-money {
    background: linear-gradient(135deg, #16a34a, #7ee787);
    color: #0a0a0a;
  }
</style>
</head>
<body>
  <div class="status-card">
    <div class="content">

      <!-- AVATAR -->
      <div class="avatar-wrap">
        <img src="https://avatars.githubusercontent.com/u/94287719?v=4" alt="Esau Victor">
      </div>

      <!-- BRAND -->
      <div class="brand-name">Esau Victor</div>
      <div class="brand-tagline">Esau De Tech Genius</div>

      <div class="divider"></div>

      <!-- HEADLINE -->
      <div class="headline">
        Website Development
        <span class="accent">Second Class</span>
      </div>

      <div class="subtitle">Registration is now open</div>

      <!-- INFO BOX -->
      <div class="info-box">
        <div class="info-row">
          <span class="icon-calendar">1</span>
          <span class="label">1st October, 2026</span>
        </div>
        <div class="info-row">
          <span class="price">₦5,000</span>
          <span class="label">per person</span>
        </div>
      </div>

      <!-- CTA -->
      <div class="cta-line">Limited seats — register now</div>

      <div class="link-pill">
        <i>🔗</i>
        esauvictor.name.ng/webdev-class
      </div>

    </div>

    <!-- SIGNATURE -->
    <div class="signature">
      <strong>Esau Victor</strong> · esauvictor.name.ng
    </div>
  </div>
</body>
</html>
